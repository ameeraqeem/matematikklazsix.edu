<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Robo Matematik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one column on phones; robot guide beside the question card from 820px (iPad landscape, laptop). Single bright light look by choice. */
:root{
  color-scheme: light;
  --bg:#F4F6FB; --card:#FFFFFF; --ink:#1D2433; --muted:#5B6475; --line:#DDE3EE;
  --blue:#3B82F6; --blue-ink:#1F5FD6; --blue-soft:#EAF1FE; --primary:#2F6FE4;
  --yellow:#F5A524; --yellow-ink:#7A4F00; --yellow-soft:#FFF4D6;
  --green:#22A06B; --green-ink:#11663F; --green-soft:#E6F6EE;
  --coral:#F26B4F; --coral-ink:#A3361C; --coral-soft:#FFEDE8;
  --purple:#7C5CE6; --purple-ink:#5B3FC4; --purple-soft:#F0ECFE;
  --font:'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ball: clamp(32px, 8vw, 46px);
  --btn: calc(var(--ball) + 10px);
  --shadow: 0 10px 30px rgba(29,36,51,0.08);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 28px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid #9CC0FF;outline-offset:2px}
.app{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(19px,3vw,24px);letter-spacing:-0.2px}
.brand svg{flex-shrink:0}
.top-right{display:flex;gap:8px;align-items:center}
.pill{height:40px;padding:0 14px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;border:none}
.stars{background:var(--yellow-soft);color:var(--yellow-ink);font-variant-numeric:tabular-nums}
.sound{background:var(--card);box-shadow:0 2px 8px rgba(29,36,51,0.08);cursor:pointer;width:44px;height:44px;padding:0;justify-content:center;border-radius:14px}

.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tab{min-height:48px;border:none;border-radius:16px;background:var(--card);box-shadow:0 2px 8px rgba(29,36,51,0.06);
  display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:clamp(13px,2.4vw,16px);color:var(--muted);cursor:pointer;padding:6px 8px}
.tab .dot{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;flex-shrink:0;font-size:12px;color:#FFFFFF}
.tab.on{color:var(--ink);box-shadow:0 0 0 2.5px var(--primary), 0 6px 16px rgba(47,111,228,0.18)}
.tab.on .dot{background:var(--primary)}
.tab.done .dot{background:var(--green)}

.main{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.guide{display:flex;align-items:flex-end;gap:10px}
.robot{flex-shrink:0;width:72px}
.robot svg{width:100%;height:auto;display:block}
.robot.happy{animation:hop .6s ease 2}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px) rotate(-4deg)}}
.bubble{flex:1;min-width:0;background:var(--card);border-radius:22px 22px 22px 6px;padding:12px 16px;box-shadow:0 6px 20px rgba(29,36,51,0.08);margin-bottom:14px}
.bubble .who{font-size:12px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase}
.bubble .say{font-size:clamp(15px,2.2vw,18px);font-weight:700;line-height:1.35;margin-top:2px}

.card{background:var(--card);border-radius:28px;padding:clamp(16px,3vw,28px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{height:30px;padding:0 12px;border-radius:15px;font-size:13px;font-weight:800;display:inline-flex;align-items:center}
.reset{height:36px;padding:0 14px;border-radius:18px;border:none;background:var(--bg);font-size:14px;font-weight:800;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
h1{margin:0;font-size:clamp(20px,3.2vw,28px);font-weight:900;line-height:1.25;letter-spacing:-0.2px;text-wrap:balance}

.row{display:flex;gap:8px;align-items:stretch}
.row > .zone{flex:1;min-width:0}
.op{align-self:center;font-size:clamp(28px,5vw,40px);font-weight:900;flex-shrink:0;min-width:22px;text-align:center}
.hintline{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:800;color:var(--muted);text-align:center}
.hintline b{font-size:24px;font-weight:900;color:var(--ink);line-height:1}

.zone{border:2.5px dashed var(--zl);background:var(--zb);border-radius:20px;padding:8px;min-height:calc(var(--btn) * 2 + 46px);
  transition:background .15s, border-color .15s, transform .15s}
.zone.short{min-height:calc(var(--btn) + 42px)}
.zone.over{border-color:var(--primary);border-style:solid;background:var(--zo);transform:scale(1.015)}
.zhead{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;font-weight:800;margin-bottom:6px;color:var(--zt);min-height:24px}
.badge{min-width:26px;height:24px;padding:0 9px;border-radius:12px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.balls{display:flex;flex-wrap:wrap;gap:4px}

.z-blue{--zl:#C9D7F2;--zb:#F7FAFF;--zo:var(--blue-soft);--zt:var(--blue-ink)}
.z-yellow{--zl:#F2DDA8;--zb:#FFFBF0;--zo:var(--yellow-soft);--zt:var(--yellow-ink)}
.z-total{--zl:#9DB9EE;--zb:#F4F7FD;--zo:#E3EDFF;--zt:var(--blue-ink)}
.z-green{--zl:#A9DCC3;--zb:#F4FBF7;--zo:#E3F4EB;--zt:var(--green-ink)}
.z-coral{--zl:#F5B8A8;--zb:#FFF8F6;--zo:var(--coral-soft);--zt:var(--coral-ink)}
.z-purple{--zl:#C7BAF5;--zb:#FAF8FF;--zo:var(--purple-soft);--zt:var(--purple-ink)}

.ball{width:var(--btn);height:var(--btn);border:none;background:transparent;padding:0;border-radius:50%;display:grid;place-items:center;
  touch-action:none;cursor:grab;-webkit-touch-callout:none}
.ball i{display:block;width:var(--ball);height:var(--ball);border-radius:50%;background:var(--c);
  box-shadow:inset -3px -4px 0 rgba(0,0,0,0.14), 0 2px 4px rgba(29,36,51,0.18);transition:transform .12s}
.ball:active i{transform:scale(0.92)}
.ball.lift{opacity:.25}
.ball.gone i{background:#FFF5F2;border:2.5px dashed var(--coral);box-shadow:none;position:relative}
.ball.gone i::before,.ball.gone i::after{content:"";position:absolute;left:50%;top:50%;width:56%;height:3px;border-radius:2px;background:#D4492C}
.ball.gone i::before{transform:translate(-50%,-50%) rotate(45deg)}
.ball.gone i::after{transform:translate(-50%,-50%) rotate(-45deg)}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:60;width:calc(var(--ball) * 1.2);height:calc(var(--ball) * 1.2);border-radius:50%;
  background:var(--c);box-shadow:inset -3px -4px 0 rgba(0,0,0,0.14), 0 14px 26px rgba(29,36,51,0.3);transform:translate(-50%,-50%)}

.sentence{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:2px}
.eq{font-size:clamp(30px,6vw,46px);font-weight:900;letter-spacing:1px}
.slot{min-width:88px;height:clamp(56px,9vw,72px);padding:0 14px;border-radius:18px;border:2.5px solid #C9D2E1;background:#F8FAFD;
  display:flex;align-items:center;justify-content:center;font-size:clamp(28px,5vw,40px);font-weight:900;font-variant-numeric:tabular-nums}
.slot.ok{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.slot.no{border-color:var(--coral)}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:56px;border-radius:18px;border:none;font-size:17px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px}
.btn.ghosty{background:var(--bg);color:var(--ink);font-weight:800}
.btn.go{flex:1;background:var(--primary);color:#FFFFFF;box-shadow:0 8px 18px rgba(47,111,228,0.28);min-width:180px}
.btn.next{flex:1;background:var(--green);color:#FFFFFF;box-shadow:0 8px 18px rgba(34,160,107,0.28);min-width:180px}

.foot{font-size:13px;color:var(--muted);text-align:center;font-weight:700}

@media (min-width:820px){
  .main{grid-template-columns:minmax(240px,300px) minmax(0,1fr);align-items:start}
  .guide{flex-direction:column;align-items:stretch;position:sticky;top:16px}
  .robot{width:150px;align-self:center;order:2}
  .bubble{order:1;margin-bottom:0;border-radius:24px 24px 24px 24px;position:relative}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-10px;width:20px;height:20px;background:var(--card);transform:translateX(-50%) rotate(45deg);border-radius:4px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app" lang="ms"></div>

<script>
(function(){
  var COLORS = { blue:'#3B82F6', yellow:'#F5A524', green:'#22A06B', purple:'#7C5CE6' };

  function robotSVG(kind){
    if (kind === 'bolt') return '<svg viewBox="0 0 84 96" aria-hidden="true"><line x1="42" y1="8" x2="42" y2="18" stroke="#1D2433" stroke-width="3" stroke-linecap="round"/><circle cx="42" cy="7" r="5" fill="#F5A524"/><rect x="6" y="32" width="7" height="16" rx="3.5" fill="#3B82F6"/><rect x="71" y="32" width="7" height="16" rx="3.5" fill="#3B82F6"/><rect x="12" y="18" width="60" height="44" rx="16" fill="#FFFFFF" stroke="#1D2433" stroke-width="3"/><rect x="20" y="26" width="44" height="28" rx="10" fill="#1D2433"/><circle cx="33" cy="38" r="4.5" fill="#7FE7FF"/><circle cx="51" cy="38" r="4.5" fill="#7FE7FF"/><path d="M35 46 Q42 51 49 46" fill="none" stroke="#7FE7FF" stroke-width="2.5" stroke-linecap="round"/><rect x="36" y="62" width="12" height="5" fill="#1D2433"/><path d="M66 74 Q78 68 76 56" fill="none" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/><circle cx="76" cy="54" r="4.5" fill="#F5A524"/><rect x="18" y="66" width="48" height="28" rx="12" fill="#3B82F6"/><circle cx="42" cy="80" r="5" fill="#FFFFFF"/></svg>';
    if (kind === 'gizmo') return '<svg viewBox="0 0 84 96" aria-hidden="true"><line x1="42" y1="8" x2="42" y2="18" stroke="#1D2433" stroke-width="3" stroke-linecap="round"/><circle cx="42" cy="7" r="5" fill="#3B82F6"/><rect x="6" y="32" width="7" height="16" rx="3.5" fill="#F26B4F"/><rect x="71" y="32" width="7" height="16" rx="3.5" fill="#F26B4F"/><rect x="12" y="18" width="60" height="44" rx="22" fill="#FFFFFF" stroke="#1D2433" stroke-width="3"/><rect x="20" y="26" width="44" height="28" rx="14" fill="#1D2433"/><path d="M29 39 Q33 34 37 39" fill="none" stroke="#7FE7FF" stroke-width="3" stroke-linecap="round"/><path d="M47 39 Q51 34 55 39" fill="none" stroke="#7FE7FF" stroke-width="3" stroke-linecap="round"/><path d="M35 46 Q42 51 49 46" fill="none" stroke="#7FE7FF" stroke-width="2.5" stroke-linecap="round"/><rect x="36" y="62" width="12" height="5" fill="#1D2433"/><path d="M18 74 Q6 68 8 56" fill="none" stroke="#F26B4F" stroke-width="6" stroke-linecap="round"/><circle cx="8" cy="54" r="4.5" fill="#3B82F6"/><rect x="18" y="66" width="48" height="28" rx="12" fill="#F26B4F"/><rect x="34" y="76" width="16" height="8" rx="4" fill="#FFFFFF"/></svg>';
    return '<svg viewBox="0 0 84 96" aria-hidden="true"><line x1="32" y1="9" x2="34" y2="18" stroke="#1D2433" stroke-width="3" stroke-linecap="round"/><line x1="52" y1="9" x2="50" y2="18" stroke="#1D2433" stroke-width="3" stroke-linecap="round"/><circle cx="31" cy="7" r="4.5" fill="#F5A524"/><circle cx="53" cy="7" r="4.5" fill="#7C5CE6"/><rect x="6" y="32" width="7" height="16" rx="3.5" fill="#22A06B"/><rect x="71" y="32" width="7" height="16" rx="3.5" fill="#22A06B"/><rect x="12" y="18" width="60" height="44" rx="12" fill="#FFFFFF" stroke="#1D2433" stroke-width="3"/><rect x="20" y="26" width="44" height="28" rx="8" fill="#1D2433"/><rect x="28" y="34" width="10" height="8" rx="4" fill="#7FE7FF"/><rect x="46" y="34" width="10" height="8" rx="4" fill="#7FE7FF"/><path d="M35 47 Q42 51 49 47" fill="none" stroke="#7FE7FF" stroke-width="2.5" stroke-linecap="round"/><rect x="36" y="62" width="12" height="5" fill="#1D2433"/><path d="M66 74 Q78 68 76 56" fill="none" stroke="#22A06B" stroke-width="6" stroke-linecap="round"/><circle cx="76" cy="54" r="4.5" fill="#F5A524"/><path d="M18 74 Q6 68 8 56" fill="none" stroke="#22A06B" stroke-width="6" stroke-linecap="round"/><circle cx="8" cy="54" r="4.5" fill="#7C5CE6"/><rect x="18" y="66" width="48" height="28" rx="12" fill="#22A06B"/><circle cx="35" cy="80" r="3.5" fill="#FFFFFF"/><circle cx="49" cy="80" r="3.5" fill="#FFFFFF"/></svg>';
  }

  function rep(n, base, prefix){ var a = []; for (var i = 0; i < n; i++){ var b = {}; for (var k in base) b[k] = base[k]; b.id = prefix + i; a.push(b); } return a; }
  var ARROW = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var Q = [
    {
      tab:'Tambah', chip:'S1 · Tambah', chipCls:'background:var(--blue-soft);color:var(--blue-ink)',
      robot:'bolt', name:'Bolt', whoColor:'var(--blue-ink)',
      title:'Tarik semua bola ke Kotak Jumlah. Berapa semuanya?', eq:'5 + 2 =',
      zones:{ a:{label:'Bola biru', cls:'z-blue', badge:function(n){return n;}, badgeStyle:'background:var(--blue-soft);color:var(--blue-ink)'},
              b:{label:'Bola kuning', cls:'z-yellow', badge:function(n){return n;}, badgeStyle:'background:var(--yellow-soft);color:var(--yellow-ink)'},
              total:{label:'Kotak Jumlah', cls:'z-total', badge:function(n){return n + ' bola';}, badgeStyle:'background:var(--primary);color:#FFFFFF'} },
      layout:function(z){ return '<div class="row">' + z('a') + '<span class="op" aria-hidden="true">+</span>' + z('b') + '</div>' +

      init:function(){ return rep(5,{color:'blue',home:'a',zone:'a'},'a').concat(rep(2,{color:'yellow',home:'b',zone:'b'},'b')); },
      allowed:function(b,z){ return z === 'total' || z === b.home; },
      tapTo:function(b){ return b.zone === 'total' ? b.home : 'total'; },
      solve:function(c){ return { slot: c.total ? String(c.total) : '?', right: c.total === 7 }; },
      say:function(c, s, r){

        if (c.total) return 'Bip bip! Sudah ada ' + c.total + ' bola dalam Kotak Jumlah.';

      }
    },
    {

      title:'Ada 7 bola. Tarik 3 bola keluar. Berapa yang tinggal?', eq:'7 − 3 =',
      zones:{ bakul:{label:'Bakul', cls:'z-green', badge:function(n){return 'Tinggal ' + n;}, badgeStyle:'background:var(--green);color:#FFFFFF'},
              keluar:{label:'Bola keluar', cls:'z-coral short', badge:function(n){return 'Keluar ' + n;}, badgeStyle:'background:var(--coral-soft);color:var(--coral-ink)', gone:true} },
      layout:function(z){ return z('bakul') + '<div class="hintline"><b aria-hidden="true">−</b>Tarik 3 bola keluar ke bawah<span style="color:var(--coral)">' + ARROW + '</span></div>' + z('keluar'); },
      init:function(){ return rep(7,{color:'green',home:'bakul',zone:'bakul'},'g'); },

      tapTo:function(b){ return b.zone === 'bakul' ? 'keluar' : 'bakul'; },
      solve:function(c){ return { slot: c.keluar ? String(c.bakul) : '?', right: c.keluar === 3 }; },

  function render(){
    var qi = state.q, q = Q[qi], s = state.per[qi], c = counts(qi), r = q.solve(c);

    function zone(id){
      var z = q.zones[id];
      var balls = s.balls.filter(function(b){ return b.zone === id; }).map(function(b){
        var label = z.gone ? 'Bola dikeluarkan, tekan untuk masukkan semula' : ('Bola, tekan atau tarik untuk pindah');
        return '<button type="button" class="ball' + (z.gone ? ' gone' : '') + '" data-id="' + b.id + '" aria-label="' + label + '" style="--c:' + COLORS[b.color] + '"><i></i></button>';
      }).join('');
      return '<div class="zone ' + z.cls + '" data-zone="' + id + '" role="group" aria-label="' + z.label + ': ' + c[id] + ' bola">' +
        '<div class="zhead"><span>' + z.label + '</span><span class="badge" style="' + z.badgeStyle + '">' + z.badge(c[id]) + '</span></div>' +
        '<div class="balls">' + balls + '</div></div>';
    }

    var tabs = Q.map(function(t, i){
      var cls = 'tab' + (i === qi ? ' on' : '') + (state.done[i] ? ' done' : '');
      var dot = state.done[i] ? '<svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>' : (i + 1);
      return '<button type="button" class="' + cls + '" data-act="go" data-q="' + i + '"' + (i === qi ? ' aria-current="step"' : '') + '><span class="dot">' + dot + '</span>' + t.tab + '</button>';
    }).join('');

    var last = qi === Q.length - 1;
    var actionMain = r.right && s.checked
      ? '<button type="button" class="btn next" data-act="' + (last ? 'again' : 'next') + '">' + (last ? 'Main semula' : 'Soalan seterusnya') +
        ' <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'
      : '<button type="button" class="btn go" data-act="check">Semak jawapan</button>';

    app.innerHTML =
      '<header class="top">' +
        '<div class="brand"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="5" fill="#3B82F6"/><circle cx="9" cy="13" r="2" fill="#FFFFFF"/><circle cx="15" cy="13" r="2" fill="#FFFFFF"/><line x1="12" y1="2.5" x2="12" y2="6" stroke="#1D2433" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="2.5" r="1.6" fill="#F5A524"/></svg>Robo Matematik</div>' +
        '<div class="top-right">' +
          '<span class="pill stars" aria-label="' + stars + ' bintang daripada 3"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" fill="#F5A524"/></svg>' + stars + ' / 3</span>' +
          '<button type="button" class="pill sound" data-act="sound" aria-pressed="' + state.sound + '" aria-label="' + (state.sound ? 'Matikan bunyi' : 'Hidupkan bunyi') + '">' +
            (state.sound
              ? '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#1D2433"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#1D2433" stroke-width="2" stroke-linecap="round"/></svg>'
              : '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#5B6475"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="#5B6475" stroke-width="2" stroke-linecap="round"/></svg>') +
          '</button>' +
        '</div>' +
      '</header>' +
      '<nav class="tabs" aria-label="Soalan">' + tabs + '</nav>' +
      '<div class="main">' +
        '<aside class="guide">' +
          '<div class="robot' + (happy ? ' happy' : '') + '">' + robotSVG(q.robot) + '</div>' +
          '<div class="bubble" role="status" aria-live="polite"><div class="who" style="color:' + q.whoColor + '">Kata ' + q.name + '</div><div class="say">' + q.say(c, s, r) + '</div></div>' +
        '</aside>' +
        '<section class="card" aria-labelledby="qtitle">' +
          '<div class="card-head"><span class="chip" style="' + q.chipCls + '">' + q.chip + '</span>' +
            '<button type="button" class="reset" data-act="reset"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="#5B6475" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Ulang</button></div>' +
          '<h1 id="qtitle">' + q.title + '</h1>' +
          q.layout(zone) +
          '<div class="sentence"><div class="eq" aria-hidden="true">' + q.eq + '</div>' +
            '<div class="slot' + (s.checked ? (r.right ? ' ok' : ' no') : '') + '" aria-label="Jawapan dikira: ' + r.slot + '">' + r.slot + '</div></div>' +
          '<div class="actions">' +
            '<button type="button" class="btn ghosty" data-act="hint"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z" fill="none" stroke="#F5A524" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Petunjuk</button>' +
            actionMain +
          '</div>' +
        '</section>' +
      '</div>' +
      '<p class="foot">Tarik bola dengan jari atau tetikus. Boleh juga tekan bola untuk pindahkannya.</p>';
    happy = false;
  }

  function moveBall(id, zoneId){
    var qi = state.q, q = Q[qi], s = state.per[qi];
    var b = s.balls.find(function(x){ return x.id === id; });
    if (!b || !q.zones[zoneId] || b.zone === zoneId || !q.allowed(b, zoneId)) { render(); return; }
    b.zone = zoneId; s.checked = false;
    pop(zoneId === 'keluar' ? 380 : 560);
    render();
  }

  // ---- drag: pointer events work for mouse, touch (iPhone, iPad, Android) and pen
  var drag = null, ghost = null, lastDragEnd = 0, overEl = null;
  function zoneAt(x, y){
    var el = document.elementFromPoint(x, y);
    return el && el.closest ? el.closest('[data-zone]') : null;
  }
  function setOver(el){
    if (overEl === el) return;
    if (overEl) overEl.classList.remove('over');
    overEl = el; if (el) el.classList.add('over');
  }
  app.addEventListener('pointerdown', function(e){
    var btn = e.target.closest('.ball');
    if (!btn) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    drag = { id: btn.dataset.id, btn: btn, sx: e.clientX, sy: e.clientY, moved: false, color: btn.style.getPropertyValue('--c') };
    try { btn.setPointerCapture(e.pointerId); } catch (err) {}
  });
  window.addEventListener('pointermove', function(e){
    if (!drag) return;
    if (!drag.moved){
      if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) < 8) return;
      drag.moved = true;
      drag.btn.classList.add('lift');
      ghost = document.createElement('div');
      ghost.className = 'ghost';
      ghost.style.setProperty('--c', drag.color);
      document.body.appendChild(ghost);
    }
    e.preventDefault();
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';
    setOver(zoneAt(e.clientX, e.clientY));
  }, { passive: false });
  function endDrag(e, cancelled){
    if (!drag) return;
    var d = drag; drag = null;
    if (!d.moved) return;
    lastDragEnd = Date.now();
    if (ghost) { ghost.remove(); ghost = null; }
    var z = cancelled ? null : zoneAt(e.clientX, e.clientY);
    setOver(null);
    if (z) moveBall(d.id, z.getAttribute('data-zone')); else render();
  }
  window.addEventListener('pointerup', function(e){ endDrag(e, false); });
  window.addEventListener('pointercancel', function(e){ endDrag(e, true); });

  app.addEventListener('click', function(e){
    var ballBtn = e.target.closest('.ball');
    if (ballBtn){
      if (Date.now() - lastDragEnd < 400) return;
      var qi = state.q, s = state.per[qi];
      var b = s.balls.find(function(x){ return x.id === ballBtn.dataset.id; });
      if (b) moveBall(b.id, Q[qi].tapTo(b, counts(qi)));
      return;
    }
    var act = e.target.closest('[data-act]');
    if (!act) return;
    var a = act.dataset.act, s2 = state.per[state.q];
    if (a === 'go') { state.q = +act.dataset.q; render(); }
    else if (a === 'hint') { s2.hint = !s2.hint; render(); }
    else if (a === 'reset') { state.per[state.q] = { balls: Q[state.q].init(), checked:false, hint:false }; render(); }
    else if (a === 'sound') { state.sound = !state.sound; render(); }
    else if (a === 'check') {
      s2.checked = true; s2.hint = false;
      var right = Q[state.q].solve(counts(state.q)).right;
      if (right) { state.done[state.q] = true; happy = true; cheer(); } else { pop(300); }
      render();
    }
    else if (a === 'next') { state.q = Math.min(state.q + 1, Q.length - 1); render(); window.scrollTo(0, 0); }
    else if (a === 'again') {
      state.q = 0; state.done = [false,false,false];
      state.per = Q.map(function(q){ return { balls:q.init(), checked:false, hint:false }; });
      render(); window.scrollTo(0, 0);
    }
  });

  render();
})();
</script>

</body>
</html>
